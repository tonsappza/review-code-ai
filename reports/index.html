<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI PR Reports — review-code-ai</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1419;
        --card: #1a2332;
        --text: #e7ecf3;
        --muted: #8b9cb3;
        --accent: #3b82f6;
        --border: #2d3a4f;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4f6f9;
          --card: #fff;
          --text: #111827;
          --muted: #6b7280;
          --border: #e5e7eb;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 2rem 1rem;
        line-height: 1.5;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.25rem;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 1.5rem;
        font-size: 0.95rem;
      }
      .filters {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-bottom: 1.25rem;
      }
      input[type="search"] {
        flex: 1;
        min-width: 200px;
        padding: 0.6rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        color: var(--text);
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      li a.card {
        display: block;
        padding: 1rem 1.1rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        text-decoration: none;
        color: inherit;
        transition: border-color 0.15s;
      }
      li a.card:hover {
        border-color: var(--accent);
      }
      .title {
        font-weight: 600;
        margin-bottom: 0.35rem;
      }
      .meta {
        font-size: 0.85rem;
        color: var(--muted);
      }
      .badge {
        display: inline-block;
        font-size: 0.75rem;
        padding: 0.15rem 0.45rem;
        border-radius: 4px;
        background: var(--accent);
        color: #fff;
        margin-right: 0.35rem;
      }
      .empty,
      .error {
        padding: 1rem;
        border-radius: 8px;
        background: var(--card);
        border: 1px dashed var(--border);
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AI PR Reports</h1>
      <p class="sub">
        รายงาน review เก็บใน repo นี้ — เปิดไฟล์ .md หรือดูรายการด้านล่าง
      </p>
      <div class="filters">
        <input
          type="search"
          id="q"
          placeholder="ค้นหา repo, PR, title..."
          autocomplete="off"
        />
      </div>
      <ul id="list"></ul>
      <p id="status" class="sub"></p>
    </main>
    <script>
      const list = document.getElementById("list");
      const status = document.getElementById("status");
      const q = document.getElementById("q");
      let reports = [];

      function render(items) {
        list.innerHTML = "";
        if (!items.length) {
          list.innerHTML =
            '<li class="empty">ยังไม่มี report — รัน review แล้วจะโผล่ที่นี่</li>';
          return;
        }
        for (const r of items) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.className = "card";
          a.href = r.reportUrl || r.path.replace(/^reports\//, "");
          a.target = "_blank";
          a.rel = "noopener";
          const when = new Date(r.reviewedAt).toLocaleString("th-TH");
          a.innerHTML = `
            <div class="title">${escapeHtml(r.title)}</div>
            <div class="meta">
              <span class="badge">${escapeHtml(r.owner)}/${escapeHtml(r.repo)} #${r.pr}</span>
              ${when} · ${r.filesChanged} files
            </div>
          `;
          li.appendChild(a);
          list.appendChild(li);
        }
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      async function load() {
        try {
          const res = await fetch("index.json");
          if (!res.ok) throw new Error("index.json not found");
          const data = await res.json();
          reports = data.reports || [];
          status.textContent = `${reports.length} report(s) · updated ${data.updatedAt || "—"}`;
          render(reports);
        } catch (err) {
          list.innerHTML = `<li class="error">โหลด index.json ไม่ได้ — เปิดผ่าน GitHub หรือรัน review ก่อน (${escapeHtml(err.message)})</li>`;
        }
      }

      q.addEventListener("input", () => {
        const term = q.value.trim().toLowerCase();
        if (!term) return render(reports);
        render(
          reports.filter(
            (r) =>
              r.title.toLowerCase().includes(term) ||
              `${r.owner}/${r.repo}`.toLowerCase().includes(term) ||
              String(r.pr).includes(term),
          ),
        );
      });

      load();
    </script>
  </body>
</html>
