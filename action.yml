name: AI PR Review
description: Post an AI code review comment on a GitHub pull request using the Cursor SDK
branding:
  icon: code
  color: blue

inputs:
  cursor_api_key:
    description: Cursor API key (cursor_...)
    required: true
  github_token:
    description: GitHub token with pull-requests:write
    required: false
    default: ${{ github.token }}
  model:
    description: Cursor model id (default composer-2.5)
    required: false
    default: composer-2.5
  pr_number:
    description: Pull request number (defaults to event PR)
    required: false
  reports_dir:
    description: Directory to save reports (markdown + index.json)
    required: false
    default: reports
  post_pr_comment:
    description: Post full review text on the PR (default false)
    required: false
    default: "false"
  post_pr_link:
    description: Post a short link to the saved report on the PR
    required: false
    default: "false"
  target_repository:
    description: Repository to review as owner/repo (defaults to event repo)
    required: false

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Install review-code-ai
      shell: bash
      run: |
        npm install --prefix "${{ github.action_path }}" --omit=dev
        echo "${{ github.action_path }}/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Run AI review
      shell: bash
      env:
        CURSOR_API_KEY: ${{ inputs.cursor_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        REVIEW_MODEL: ${{ inputs.model }}
        PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        TARGET_REPOSITORY: ${{ inputs.target_repository }}
        REPORTS_DIR: ${{ github.action_path }}/reports
        POST_PR_COMMENT: ${{ inputs.post_pr_comment }}
        POST_PR_LINK: ${{ inputs.post_pr_link }}
      run: |
        cd "${{ github.workspace }}"
        npx --prefix "${{ github.action_path }}" tsx "${{ github.action_path }}/src/review-pr.ts"
